{% extends "base.html" %}
{% block titre %}Poste DA{% endblock %}
{% block contenu %}
<a href="{{ url_for('detail_da', da_id=da.id) }}" class="small">← DA {{ da.reference }}</a>
<h3>{{ 'Modifier le poste ' ~ poste.numero if poste.id else 'Nouveau poste' }} – DA {{ da.reference }}</h3>
<form method="post" class="card card-body" style="max-width: 50rem">
  <div class="row g-3">
    <div class="col-md-3"><label class="form-label">Poste *</label>
      <input name="numero" type="number" class="form-control" required value="{{ poste.numero or '' }}"></div>
    <div class="col-md-9"><label class="form-label">Nom *</label>
      <input name="nom" class="form-control" required autofocus value="{{ poste.nom or '' }}"></div>
    <div class="col-md-4"><label class="form-label">Montant (€)</label>
      <input name="montant" class="form-control" inputmode="decimal" value="{{ poste.montant if poste.montant is not none else '' }}"></div>
    <div class="col-md-4"><label class="form-label">Date de livraison</label>
      <input name="date_livraison" type="date" class="form-control" value="{{ poste.date_livraison or '' }}"></div>
    <div class="col-md-4"><label class="form-label">Code d'imputation</label>
      <input name="code_imputation" class="form-control" placeholder="ex. 23T_0531" value="{{ poste.code_imputation or '' }}"></div>
    <div class="col-md-6"><label class="form-label">Demandeur</label>
      <input name="demandeur" class="form-control" value="{{ poste.demandeur or '' }}"></div>
    <div class="col-md-6"><label class="form-label">Certificateur</label>
      <input name="certificateur" class="form-control" value="{{ poste.certificateur or '' }}"></div>
  </div>
  <div class="d-flex gap-2 mt-4">
    <button class="btn btn-primary">Enregistrer</button>
    {% if not poste.id %}<button class="btn btn-outline-primary" name="continuer" value="1">Enregistrer et ajouter un autre poste</button>{% endif %}
    <a class="btn btn-outline-secondary" href="{{ url_for('detail_da', da_id=da.id) }}">Annuler</a>
  </div>
</form>
{% endblock %}
