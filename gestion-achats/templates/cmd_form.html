{% extends "base.html" %}
{% block titre %}{{ 'Commande ' ~ cmd.reference if cmd.id else 'Nouvelle commande' }}{% endblock %}
{% block contenu %}
<h3>{{ 'Modifier la commande ' ~ cmd.reference if cmd.id else 'Nouvelle commande' }}</h3>
<form method="post" class="card card-body" style="max-width: 40rem">
  <div class="mb-3"><label class="form-label">Numéro de référence *</label>
    <input name="reference" class="form-control" required autofocus value="{{ cmd.reference or '' }}"></div>
  <div class="mb-3"><label class="form-label">Commentaire</label>
    <textarea name="commentaire" class="form-control" rows="3">{{ cmd.commentaire or '' }}</textarea></div>
  <div class="d-flex gap-2">
    <button class="btn btn-primary">Enregistrer</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('detail_commande', cmd_id=cmd.id) if cmd.id else url_for('liste_commandes') }}">Annuler</a>
  </div>
</form>
{% endblock %}
