{% extends "base.html" %}
{% block titre %}BdC {{ cmd.libelle }}{% endblock %}
{% block contenu %}
<a href="{{ url_for('detail_commande', cmd_id=cmd.id) }}" class="small">← BdC {{ cmd.libelle }}</a>
<h3>Modifier le BdC {{ cmd.libelle }}</h3>
<form method="post" class="card card-body" style="max-width: 40rem">
  <div class="mb-3"><label class="form-label">N° de BdC</label>
    <input name="reference" class="form-control" autofocus value="{{ cmd.reference or '' }}" placeholder="communiqué par le service achat"></div>
  <div class="mb-3"><label class="form-label">Marché</label>
    <select name="marche_id" class="form-select" id="marche">
      <option value="">— hors marché —</option>
      {% for m in marches %}
        <option value="{{ m.id }}" data-lots="{{ m.lots or '' }}" {{ 'selected' if cmd.marche_id == m.id }}>
          {{ m.reference }}{% if m.titulaire %} — {{ m.titulaire }}{% endif %}{% if m.restant is not none %} — reste {{ m.restant|euros }}{% endif %}
        </option>
      {% endfor %}
    </select></div>
  <div class="mb-3" id="bloc-lot"><label class="form-label">Lot</label>
    <input name="lot" id="lot" class="form-control" list="liste-lots" value="{{ cmd.lot or '' }}">
    <datalist id="liste-lots"></datalist>
    <div class="form-text">Repris dans l'e-mail : « sur le lot … ».</div></div>
  <div class="mb-3"><label class="form-label">Commentaire</label>
    <textarea name="commentaire" class="form-control" rows="3">{{ cmd.commentaire or '' }}</textarea></div>
  <div class="d-flex gap-2">
    <button class="btn btn-primary">Enregistrer</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('detail_commande', cmd_id=cmd.id) }}">Annuler</a>
  </div>
</form>
<script>
  // Lots proposés selon le marché choisi
  const marche = document.getElementById("marche");
  const majLots = () => {
    const opt = marche.selectedOptions[0];
    const lots = opt && opt.value ? opt.dataset.lots.split(";").map((x) => x.trim()).filter(Boolean) : [];
    document.getElementById("liste-lots").innerHTML = lots.map((l) => `<option value="${l}">`).join("");
    document.getElementById("bloc-lot").hidden = !(opt && opt.value);
  };
  marche.addEventListener("change", majLots);
  majLots();
</script>
{% endblock %}
