<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}Achats{% endblock %} – Budgets DA / BdC</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
{% set page = request.endpoint %}
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('accueil') }}">Budgets DA / BdC</a>
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link {% if page in ['liste_da','detail_da','form_da','form_poste_da'] %}active{% endif %}" href="{{ url_for('liste_da') }}">DA</a></li>
      <li class="nav-item"><a class="nav-link {% if page == 'postes_da' %}active{% endif %}" href="{{ url_for('postes_da') }}">Suivi DA</a></li>
      <li class="nav-item"><a class="nav-link {% if page in ['liste_commandes','detail_commande','form_commande','form_poste_commande'] %}active{% endif %}" href="{{ url_for('liste_commandes') }}">BdC</a></li>
      <li class="nav-item"><a class="nav-link {% if page == 'postes_commande' %}active{% endif %}" href="{{ url_for('postes_commande') }}">Suivi BdC</a></li>
    </ul>
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link {% if page == 'import_excel' %}active{% endif %}" href="{{ url_for('import_excel') }}">Importer Excel</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('export_excel') }}">Exporter Excel</a></li>
    </ul>
  </div>
</nav>
<main class="container-fluid px-4">
  {% for categorie, message in get_flashed_messages(with_categories=true) %}
    <div class="alert alert-{{ categorie }}">{{ message }}</div>
  {% endfor %}
  {% block contenu %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
